name: Test
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Update Rust toolchain
        run: rustup update
      - name: cargo test
        run: cargo test
