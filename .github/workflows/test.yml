name: Test
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Update Rust toolchain
        run: rustup update
      - name: cargo test
        run: cargo test
